name: Generar APK de Android (Airflare Dashboard)

# Se ejecuta solo cuando tú lo lanzas manualmente desde la pestaña "Actions" de GitHub
on:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java (necesario para firmar el APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Node.js (necesario para Bubblewrap)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar la herramienta Bubblewrap (Google) que empaqueta la PWA como app Android
        run: npm install -g @bubblewrap/cli

      - name: "Configurar Bubblewrap para usar el SDK de Android que ya trae el runner (evita el aviso de Términos y Condiciones)"
        run: |
          set -e
          mkdir -p "$HOME/.bubblewrap"
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "JDK detectado en:         $JAVA_HOME"
          echo "Android SDK detectado en: $ANDROID_SDK"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK"
          }
          EOF
          echo "── Configuración guardada ──"
          cat "$HOME/.bubblewrap/config.json"

      - name: Preparar la clave de firma de la app
        run: |
          mkdir -p android-build
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Usando la clave de firma guardada en los secretos del repositorio"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-build/airflare.keystore
          else
            echo "🆕 No hay clave guardada todavía: generando una nueva (solo la primera vez)"
            keytool -genkeypair -v \
              -keystore android-build/airflare.keystore \
              -alias airflare -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "airflare2026" -keypass "airflare2026" \
              -dname "CN=Airflare Dashboard, OU=Personal, O=Airflare, L=Madrid, S=Madrid, C=ES"
          fi

      - name: Crear el proyecto Android (TWA) a partir del manifest.json de la PWA
        run: |
          set -e
          mkdir -p android-build/twa-project
          cd android-build/twa-project
          # bubblewrap init es interactivo y hace varias preguntas (nombre, colores, etc.).
          # Le enviamos líneas vacías para que acepte los valores por defecto que detecta del manifest.json
          yes "" | bubblewrap init \
            --manifest "https://jonathan-explore.github.io/breakdancetraining/manifest.json"
          echo "── Contenido generado en twa-project ──"
          ls -la

      - name: Compilar y firmar el APK
        working-directory: android-build/twa-project
        run: |
          set -e
          yes "" | bubblewrap build \
            --signingKeyPath ../airflare.keystore \
            --signingKeyAlias airflare
          echo "── Archivos generados ──"
          find . -maxdepth 3 \( -iname "*.apk" -o -iname "*.aab" \) -print

      - name: Subir el APK como descarga del workflow
        uses: actions/upload-artifact@v4
        with:
          name: airflare-apk
          path: |
            android-build/twa-project/**/*.apk
            android-build/twa-project/**/*.aab
          if-no-files-found: warn

      - name: "Subir la clave de firma como copia de seguridad (IMPORTANTE: descárgala y guárdala)"
        uses: actions/upload-artifact@v4
        with:
          name: GUARDAR-clave-de-firma
          path: android-build/airflare.keystore
