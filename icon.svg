<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06060f"/>
      <stop offset="100%" style="stop-color:#0a0b17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b00"/>
      <stop offset="100%" style="stop-color:#c8973c"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c35"/>
      <stop offset="100%" style="stop-color:#c8973c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- AF text -->
  <text x="256" y="295" font-family="Arial Black, Helvetica, sans-serif"
    font-size="220" font-weight="900" fill="url(#letter)"
    text-anchor="middle" dominant-baseline="middle"
    letter-spacing="-12" filter="url(#glow)">AF</text>
  <!-- Bottom accent bar -->
  <rect x="80" y="390" width="352" height="8" rx="4" fill="url(#accent)" opacity="0.9"/>
  <!-- Small dot accent -->
  <circle cx="256" cy="430" r="6" fill="url(#accent)" opacity="0.6"/>
</svg>
